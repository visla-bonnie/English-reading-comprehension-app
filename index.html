<style>
:root{--ink:#0f172a;--muted:#64748b;--blue:#2563eb;--green:#16a34a;--amber:#f59e0b;--pink:#ec4899;--card:#fff;--line:#dbe3ef}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,Helvetica,sans-serif;color:var(--ink);background:radial-gradient(circle at 5% 0%,#dbeafe 0,#f8fafc 35%,#fff7ed 100%);min-height:100vh}

h1{font-size:clamp(34px,5vw,54px);margin:0 0 8px;letter-spacing:-1.8px} h2{margin-top:0} h3{margin-bottom:8px} p{line-height:1.6} .muted{color:var(--muted)} .hero .muted{color:#dbeafe}
.heroStats{display:grid;grid-template-columns:1fr 1fr;gap:10px} .stat{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);padding:16px;border-radius:18px} .stat b{display:block;font-size:30px}
.nav{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0} button,.btn{border:0;border-radius:14px;padding:11px 15px;background:#fff;color:var(--ink);font-weight:750;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.08)} button:hover{transform:translateY(-1px)} button.active,.dark{background:#0f172a;color:#fff} .blue{background:#dbeafe;color:#1d4ed8} .green{background:#dcfce7;color:#166534} .amber{background:#fef3c7;color:#92400e} .danger{background:#fee2e2;color:#991b1b}

.cover:hover{transform:translateY(-5px) rotate(-.6deg)} .cover:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.12);right:-70px;bottom:-70px} .coverTitle{font-size:30px;line-height:1.03;font-weight:900;letter-spacing:-1px;position:relative;z-index:1} .emoji{font-size:58px;filter:drop-shadow(0 5px 8px rgba(0,0,0,.22))} .tag{display:inline-block;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);font-size:12px;margin:4px 3px 0 0}
.cover-ocean{background:linear-gradient(135deg,#0f172a,#1d4ed8,#06b6d4)} .cover-purple{background:linear-gradient(135deg,#312e81,#7c3aed,#db2777)} .cover-pink{background:linear-gradient(135deg,#831843,#ec4899,#f59e0b)} .cover-space{background:linear-gradient(135deg,#020617,#312e81,#0ea5e9)} .cover-ember{background:linear-gradient(135deg,#111827,#92400e,#f59e0b)} .cover-bronze{background:linear-gradient(135deg,#451a03,#a16207,#d6d3d1)} .cover-teal{background:linear-gradient(135deg,#134e4a,#0f766e,#22d3ee)} .cover-sky{background:linear-gradient(135deg,#1e3a8a,#38bdf8,#f0abfc)} .cover-gold{background:linear-gradient(135deg,#78350f,#f59e0b,#fde68a)} .cover-winter{background:linear-gradient(135deg,#334155,#0284c7,#e0f2fe)} .cover-forest{background:linear-gradient(135deg,#052e16,#166534,#84cc16)} .cover-custom{background:linear-gradient(135deg,#4338ca,#06b6d4,#22c55e)}

const KEY="audreyReadingHubV5";

function deepClone(x){return JSON.parse(JSON.stringify(x))}
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}
function slug(s){return String(s||"book").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+Date.now()}
function localDate(){const d=new Date(); const z=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function shuffle(a){let x=[...a]; for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]} return x}
function normTitle(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"")}

function normalizeBook(b){
 return {
   id:b.id||slug(b.title), title:b.title||"Untitled Book", author:b.author||"Unknown",
   level:b.level||"Middle School", genre:b.genre||"Middle Grade",
   description:b.description||"Added to Audrey's Reading Library.",
   themes:Array.isArray(b.themes)?b.themes.join(", "):(b.themes||"Discover and record the major themes while reading."),
   characters:Array.isArray(b.characters)?b.characters.join(", "):(b.characters||"Track the main characters while reading."),
   setting:b.setting||"Discover and record the setting while reading.",
   cover:b.cover||"cover-custom", emoji:b.emoji||"📘", sets:b.sets||[],
   vocab:b.vocab||b.vocabulary||[], chapters:b.chapters||b.chapterGuide||[], quiz:b.quiz||[], mcq:b.mcq||[]
 }
}
function mergePreloaded(existing){
 const out=(existing||[]).map(normalizeBook);
 PRELOADED_BOOKS.forEach(p=>{if(!out.some(b=>normTitle(b.title)===normTitle(p.title))) out.push(normalizeBook(p))});
 return out;
}

function autoQuestions(b){
 let qs=[];
 (b.chapters||[]).forEach(c=>(c[3]||[]).forEach(q=>qs.push(q)));
 const theme=(b.themes||"a major theme").split(",")[0];
 qs.push(
   `Who is the most important character in ${b.title} so far? Use one detail from the book.`,
   `Describe the setting of ${b.title}. How does the setting affect what happens?`,
   `What is the main conflict right now? Is it internal, external, or both?`,
   `What can you infer about a character's feelings? Give text evidence.`,
   `What is one important change a character has made? What caused it?`,
   `What is one example of ${theme} in the book? Explain.`,
   `Summarize the section you just read in 3–4 sentences.`,
   `Choose one important event. Why does it matter to the plot?`,
   `Make a prediction about what will happen next and explain your evidence.`,
   `Find one detail that shows the author's point of view or purpose.`,
   `What is one challenging word from today's reading? Use context clues to explain it.`,
   `What question would you ask the author about this part of the book?`,
   `Compare two characters. How are they similar and different?`,
   `What lesson could a reader learn from this part of the story?`,
   `If you could change one decision a character made, what would you change and why?`
 );
 return [...new Set(qs)];
}

function practiceBook(){return state.books.find(b=>b.id===state.practice.bookId)||book()}
function buildVocabDeck(b,count){
 const allDefs=state.books.flatMap(x=>(x.vocab||[]).map(v=>v[1])).filter(Boolean);
 return shuffle(b.vocab||[]).slice(0,count).map(v=>{
   const wrong=shuffle(allDefs.filter(d=>d!==v[1])).slice(0,3);return {kind:"mcq",prompt:`What is the best meaning of “${v[0]}”?`,choices:shuffle([v[1],...wrong]),answer:v[1],extra:v[2]||""}
 })
}
function buildCompDeck(b,count){
 const mcq=(b.mcq||[]).map(x=>({kind:"mcq",prompt:x[0],choices:x[1],answer:x[1][x[2]],extra:""}));
 const qa=(b.quiz||[]).map(x=>({kind:"reveal",prompt:x[0],answer:x[1]}));
 const coach=autoQuestions(b).map(q=>({kind:"write",prompt:q}));
 return shuffle([...mcq,...qa,...coach]).slice(0,count)
}
function startPractice(){
 const b=practiceBook(),n=Number(state.practice.count||10);
 let deck=state.practice.mode==="vocab"?buildVocabDeck(b,n):buildCompDeck(b,n);
 if(!deck.length && state.practice.mode==="vocab")return alert("This book has no vocabulary yet. Use Reading Coach or import a full Book JSON.");
 state.practice.deck=deck;state.practice.index=0;state.practice.score=0;state.practice.answered=false;save();render()
}
function chooseAnswer(choice){
 const q=state.practice.deck[state.practice.index];if(state.practice.answered)return;state.practice.answered=true;if(choice===q.answer)state.practice.score++;state.practice.lastChoice=choice;save();render()
}
function nextPractice(){
 state.practice.index++;state.practice.answered=false;state.practice.lastChoice="";save();render()
}
function saveCoachAnswer(q,answer){
 const b=practiceBook();const p=prog(b.id);p.coachAnswers[q]=answer;save()
}

function addImport(){
 return `<div class="two"><div><div class="card"><h2>Quick Add a New Book</h2><p class="muted">Audrey only needs the title. The app immediately creates a cover, Reading Log, quarterly tracking, and automatic Reading Coach questions.</p><div class="fieldGrid"><div><label>Title *</label><input value="${esc(state.quick.title)}" oninput="state.quick.title=this.value;save()"></div><div><label>Author</label><input value="${esc(state.quick.author)}" oninput="state.quick.author=this.value;save()"></div><div><label>Genre</label><input value="${esc(state.quick.genre)}" oninput="state.quick.genre=this.value;save()"></div><div><label>Cover Emoji</label><input value="${esc(state.quick.emoji)}" oninput="state.quick.emoji=this.value;save()"></div></div><br><button class="dark" onclick="quickAdd()">Add Book Automatically</button></div>
 <br><div class="card"><h2>Full Book JSON Import</h2><p class="muted">Use this when you want book-specific setting, characters, vocabulary, guided reading, and answer-check questions. No API key is stored in the website.</p><textarea style="min-height:290px;font-family:monospace" oninput="state.importText=this.value;save()" placeholder="Paste Book JSON here...">${esc(state.importText)}</textarea><br><br><button class="dark" onclick="importBook()">Import / Update Book</button></div></div>
 <div><div class="card"><h2>How “Auto” Works</h2><p><b>Quick Add:</b> no code change. The app creates the book card, log, tracker, and universal comprehension questions automatically.</p><p><b>Full Guide:</b> copy the prompt below to ChatGPT, then paste the returned JSON. The app upgrades that same book with book-specific vocabulary, setting, guide, and quiz.</p><button class="blue" onclick="copyBookPrompt()">Copy Prompt for Current Book</button></div><br><div class="notice"><b>Why this is safe:</b> the GitHub Pages site contains no private API key. The app works entirely in the browser.</div></div></div>`
}
function backup(){
 return `<div class="two"><div class="card"><h2>Backup Audrey’s Reading Records</h2><p>Reading progress is stored in this browser. Export a backup occasionally so quarterly records are safe if the browser is cleared or Audrey changes devices.</p><button class="dark" onclick="exportData()">Download Backup JSON</button></div><div class="card"><h2>Restore Backup</h2><textarea oninput="state.backupText=this.value;save()" placeholder="Paste a Reading Hub backup JSON here...">${esc(state.backupText||"")}</textarea><br><br><button class="green" onclick="importBackupText()">Restore Backup</button></div></div>`
}
function render(){
 const stats=quarterStats();let content="";
 if(state.tab==="dashboard")content=dashboard();
 if(state.tab==="library")content=library();
 if(state.tab==="book")content=bookRoom();
 if(state.tab==="practice")content=practice();
 if(state.tab==="quarter")content=quarter();
 if(state.tab==="add")content=addImport();
 if(state.tab==="backup")content=backup();
 document.getElementById("app").innerHTML=`<div class="wrap"><div class="hero"><div><div class="pill" style="background:rgba(255,255,255,.15);color:#fff">Audrey • 7th Grade Reading</div><h1>Audrey Reading Hub</h1><p class="muted">Reading Library + ERB Vocabulary + Comprehension Practice + 4-Books-Per-Quarter Tracker</p></div><div class="heroStats"><div class="stat"><span>${state.quarter}</span><b>${stats.finished}/4</b><span>books finished</span></div><div class="stat"><span>Library</span><b>${state.books.length}</b><span>books ready</span></div><div class="stat"><span>Current Book</span><b style="font-size:18px">${esc(book().title)}</b></div><div class="stat"><span>Safe Mode</span><b style="font-size:18px">No API Key</b></div></div></div>${nav()}${content}<div class="footer">Audrey Reading Hub V5 · Data saves locally in this browser</div></div>`
}
render();
</script>
